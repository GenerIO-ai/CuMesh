name: Build & Release Wheels (CUDA)

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  TORCH_VERSION: "2.5.1"
  PYTORCH_INDEX_URL: "https://download.pytorch.org/whl/cu124"
  CUDA_IMAGE: "nvidia/cuda:12.4.1-devel-ubuntu22.04"
  GIT_TERMINAL_PROMPT: "0"
  PIP_NO_INPUT: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  build-wheels:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
            target: linux_310
          - os: ubuntu-latest
            python-version: "3.11"
            target: linux_311

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build wheel inside CUDA container
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          set -euo pipefail
          mkdir -p dist

          docker run --rm \
            -v "${PWD}:/src" -w /src \
            -e TORCH_CUDA_ARCH_LIST="8.0;8.6;8.9;9.0+PTX" \
            -e CUDA_HOME=/usr/local/cuda \
            -e TORCH_VERSION="${TORCH_VERSION}" \
            -e PYTORCH_INDEX_URL="${PYTORCH_INDEX_URL}" \
            -e PYTHON_VERSION="${PYTHON_VERSION}" \
            -e GIT_TERMINAL_PROMPT="${GIT_TERMINAL_PROMPT}" \
            -e PIP_NO_INPUT="${PIP_NO_INPUT}" \
            -e PIP_DISABLE_PIP_VERSION_CHECK="${PIP_DISABLE_PIP_VERSION_CHECK}" \
            -e DEBIAN_FRONTEND=noninteractive \
            -e TZ=Etc/UTC \
            "${CUDA_IMAGE}" \
              bash -lc '
                set -euo pipefail

                export DEBIAN_FRONTEND=noninteractive
                export TZ=Etc/UTC

                apt-get update
                apt-get install -y --no-install-recommends \
                  ca-certificates curl \
                  software-properties-common \
                  git build-essential ninja-build cmake libeigen3-dev

                add-apt-repository -y ppa:deadsnakes/ppa
                apt-get update
                apt-get install -y --no-install-recommends \
                  "python${PYTHON_VERSION}" \
                  "python${PYTHON_VERSION}-dev" \
                  "python${PYTHON_VERSION}-venv" \
                  "python${PYTHON_VERSION}-distutils" \
                  python3-pip

                PYBIN="python${PYTHON_VERSION}"
                VENV_DIR=".venv-${PYBIN}"

                rm -rf build/ .eggs/ *.egg-info || true
                rm -rf "$VENV_DIR" || true

                "$PYBIN" -m venv "$VENV_DIR"
                . "$VENV_DIR/bin/activate"

                python -m pip --version
                python -m pip install -U pip setuptools wheel
                python -m pip install "torch==${TORCH_VERSION}" --index-url "${PYTORCH_INDEX_URL}"
                python -c "import torch; print(torch.__version__); print(torch.version.cuda)"

                export EIGEN3_INCLUDE_DIR=/usr/include/eigen3
                test -f "$EIGEN3_INCLUDE_DIR/Eigen/Core"
                python -m pip wheel . -w /src/dist --no-build-isolation --no-deps -v

                deactivate
                ls -lah dist
              '

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.target }}
          path: dist/cumesh*.whl
          if-no-files-found: error

  release:
    name: Publish Release Assets
    needs: build-wheels
    runs-on: ubuntu-latest
    steps:
      - name: Download wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true

      - name: List wheels
        run: ls -lah dist

      - name: Upload wheels to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/cumesh*.whl
          generate_release_notes: true
